<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DebtQuest Support has moved</title>
  <link rel="canonical" href="https://everydaygoodapps.github.io/debtquest-support/">
  <script>
    window.location.replace(
      "https://everydaygoodapps.github.io/debtquest-support/" +
      window.location.search +
      window.location.hash
    );
  </script>
</head>
<body>
  <p>DebtQuest Support has moved.</p>
  <p>
    <a id="destination" href="https://everydaygoodapps.github.io/debtquest-support/">
      Continue to DebtQuest Support and Privacy Policy
    </a>
  </p>
  <script>
    document.getElementById("destination").href +=
      window.location.search + window.location.hash;
  </script>
</body>
</html>
